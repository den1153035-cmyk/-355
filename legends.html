<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Легенди NBA — HoopLegends</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    .card-hover:hover { transform: translateY(-15px) scale(1.03); box-shadow: 0 25px 50px -12px rgb(234 179 8); }
    .fade-in { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <nav class="fixed top-0 w-full bg-black/90 backdrop-blur-md z-50 border-b border-yellow-500">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <h1 class="text-3xl font-bold flex items-center gap-3">
        <i class="fas fa-basketball-ball text-yellow-500"></i>
        HoopLegends
      </h1>
      <div class="flex gap-8 text-lg">
        <a href="index.html" class="hover:text-yellow-400 transition">Головна</a>
        <a href="legends.html" class="text-yellow-400 font-bold">Легенди</a>
        <a href="talents.html" class="hover:text-yellow-400 transition">Молоді Таланти</a>
        <a href="myteam.html" class="hover:text-yellow-400 transition">Моя Команда</a>
      </div>
    </div>
  </nav>

  <section class="h-screen bg-zinc-900 flex items-center justify-center text-center relative overflow-hidden">
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1504450758481-7338eba7524a?q=80&w=2070')] bg-cover opacity-40"></div>
    <div class="relative z-10 max-w-5xl px-6">
      <h2 class="text-6xl md:text-7xl font-black mb-6">ЛЕГЕНДИ БАСКЕТБОЛУ</h2>
      <p class="text-3xl text-yellow-400">Гравці, які назавжди змінили гру</p>
    </div>
  </section>

  <section class="py-24 bg-zinc-900">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-5xl font-bold text-center mb-16">Великі Легенди NBA</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8" id="legends-grid"></div>
    </div>
  </section>

  <div id="playerModal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 max-w-2xl w-full rounded-3xl overflow-hidden">
      <div class="relative">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-4xl text-white hover:text-yellow-500 z-10">×</button>
        <div id="modal-content"></div>
      </div>
    </div>
  </div>

  <script>
    const legends = [
      {
        name: "Майкл Джордан", team: "Chicago Bulls", position: "SG",
        img: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800",
        bio: "Найвеличніший гравець в історії баскетболу.",
        teams: ["Chicago Bulls", "Washington Wizards"],
        achievements: ["6× чемпіон NBA", "6× MVP фіналу", "5× MVP сезону"],
        stats: "30.1 PPG • 6.2 RPG • 5.3 APG"
      },
      {
        name: "Леброн Джеймс", team: "Los Angeles Lakers", position: "SF",
        img: "https://images.unsplash.com/photo-1611003229186-5e40c0f4a5b0?w=800",
        bio: "Король сучасного баскетболу.",
        teams: ["Cleveland Cavaliers", "Miami Heat", "Los Angeles Lakers"],
        achievements: ["4× чемпіон NBA", "4× MVP"],
        stats: "27.1 PPG • 7.5 RPG • 7.4 APG"
      },
      {
        name: "Кобі Браянт", team: "Los Angeles Lakers", position: "SG",
        img: "https://images.unsplash.com/photo-1594737625785-a6cbdabd3321?w=800",
        bio: "Mamba Mentality.",
        teams: ["Los Angeles Lakers"],
        achievements: ["5× чемпіон NBA"],
        stats: "25.0 PPG"
      },
      {
        name: "Стівен Каррі", team: "Golden State Warriors", position: "PG",
        img: "https://images.unsplash.com/photo-1589333242123-2f0d9f4d6d6e?w=800",
        bio: "Найкращий снайпер в історії.",
        teams: ["Golden State Warriors"],
        achievements: ["4× чемпіон NBA"],
        stats: "24.8 PPG"
      }
    ];

    function renderLegends() {
      const grid = document.getElementById('legends-grid');
      grid.innerHTML = '';
      legends.forEach((player, index) => {
        const card = document.createElement('div');
        card.className = `bg-zinc-800 rounded-3xl overflow-hidden card-hover fade-in cursor-pointer`;
        card.style.animationDelay = `${index * 100}ms`;
        card.innerHTML = `
          <img src="${player.img}" class="w-full h-64 object-cover">
          <div class="p-6">
            <h3 class="text-2xl font-bold">${player.name}</h3>
            <p class="text-yellow-500">${player.team}</p>
          </div>
        `;
        card.onclick = () => showModal(player);
        grid.appendChild(card);
      });
      setTimeout(() => document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible')), 200);
    }

    function showModal(player) {
      document.getElementById('modal-content').innerHTML = `
        <img src="${player.img}" class="w-full h-80 object-cover">
        <div class="p-8">
          <h2 class="text-4xl font-bold">${player.name}</h2>
          <p class="text-yellow-500">${player.position} • ${player.team}</p>
          <p class="my-6 text-zinc-300">${player.bio}</p>
          <p class="text-2xl font-mono">${player.stats}</p>
        </div>
      `;
      document.getElementById('playerModal').classList.remove('hidden');
      document.getElementById('playerModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('playerModal').classList.add('hidden');
      document.getElementById('playerModal').classList.remove('flex');
    }

    window.onload = renderLegends;
  </script>
</body>
</html>
